name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  budget-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin
          cache: maven

      - name: Build and test
        working-directory: budget-core
        run: ./mvnw --batch-mode verify
