# Test-only settings, layered over src/main/resources/application.yml.
#
# The scheduled bank refresh stays off in every test context. Left on, a long integration run would
# fire it part-way through and start syncs against whatever connection rows a test left behind -
# and on a developer machine, where real Plaid keys are in the environment, that is a test touching
# the network, which PACKET_RULES rule 9 forbids. BankRefreshScheduleTest covers the schedule itself.
ingestion.sync.scheduled=false
