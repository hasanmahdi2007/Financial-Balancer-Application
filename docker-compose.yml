# Local development stack.
#
# SECURITY NOTE, load-bearing rather than decorative:
# `budget-core` must NOT publish a port.
# It trusts a user-id header injected by the gateway, so anything that can reach it directly can
# forge that header and read another user's bank data. Only `api-gateway` gets a published port.
# This is exactly the line a future change deletes "to make local testing easier" - don't.
# `ProfileAndFundsSpecTest.budgetCoreIsUnreachableFromOutsideTheComposeNetwork` reads this file and
# fails if it happens.
#
# Postgres and Redis publish to localhost on purpose: they are needed by tests and by the app when
# it is run from an IDE outside this stack. They are not reachable from outside this machine.
#
# PORTS ARE CHOSEN TO COEXIST WITH THE jobs-tracker STACK, which runs on the same machine and holds
# 6379 (redis) and 8080 (api-gateway), and a NATIVE Windows Postgres holds 5432. So: Postgres here
# is on 5434 and Redis on 6380. When the gateway is added in
# packet P6 it must not take 8080 either.

services:
  # Pinned to 15 rather than 17 because that image is already on this machine and the network here
  # drops constantly. Nothing in this project needs a 17-only feature, and 15 is supported to 2027.
  # Testcontainers must pin the SAME version so local and CI test the database we actually ship.
  postgres:
    image: postgres:15-alpine
    container_name: fb-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-budget}
      POSTGRES_USER: ${POSTGRES_USER:-budget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budget}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Without this, the app starts before Postgres accepts connections and Flyway fails on a
      # cold machine in a way that looks like a migration bug.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-budget} -d ${POSTGRES_DB:-budget}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fb-redis
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The domain service. No `ports` key, and there must never be one - see the note at the top of this
  # file. The gateway reaches it by service name inside this network, which is the only way in.
  budget-core:
    build: ./budget-core
    container_name: fb-budget-core
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-budget}
      POSTGRES_USER: ${POSTGRES_USER:-budget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-budget}
      REDIS_HOST: redis
      # 6379 inside the network: the 6380 in the mappings above is a host-side choice, made because
      # another stack on this machine already holds 6379 there.
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The only service reachable from outside. It validates the caller's Supabase token, rate-limits,
  # and injects the user id that budget-core trusts.
  api-gateway:
    build: ./api-gateway
    container_name: fb-api-gateway
    # 8090, because the jobs-tracker stack on this machine holds 8080.
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      BUDGET_CORE_URI: http://budget-core:8080
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWKS_URI: ${SUPABASE_JWKS_URI}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
      budget-core:
        condition: service_started

volumes:
  # External, so Compose never deletes it: `docker compose down -v` removes every volume Compose
  # created, and this one once took every user's plans and history with it. Create it once per
  # machine, before the first `up`:
  #
  #   docker volume create fb-postgres-data
  #
  # Compose refuses to start without it rather than quietly making an empty one, which is the point:
  # a missing database should be loud. Resetting the data is now a deliberate, separate act:
  # `docker compose down`, then `docker volume rm fb-postgres-data`, then create it again.
  postgres-data:
    external: true
    name: fb-postgres-data
